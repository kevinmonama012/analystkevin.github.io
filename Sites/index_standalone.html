<html lang="en">

<style>
/* ============================================================
   Gedion Freight Intelligence — Control Tower visual system
   Palette: night operations / radar-room, not SaaS-card default.
   ============================================================ */

@font-face {
  font-family: "Fraunces-fallback";
  src: local("Georgia");
}

:root {
  --bg:        #07090D;
  --bg-2:      #0B0F15;
  --panel:     #10151C;
  --panel-alt: #151C24;
  --panel-glass: rgba(21, 28, 36, 0.55);
  --border:    #1E2833;
  --border-lt: #2A3847;
  --amber:     #FF8A3D;
  --amber-soft: #FFB380;
  --amber-dim: #6B4322;
  --teal:      #34E0C8;
  --teal-dim:  #16544C;
  --text:      #EDF2F6;
  --text-mid:  #97A6B4;
  --text-dim:  #5C6B79;
  --danger:    #FF5D6C;
  --success:   #3FE0A0;
  --warn:      #F4C563;

  --font-head: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Times New Roman", serif;
  --font-body: -apple-system, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-data: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;

  --shadow-panel: 0 1px 0 rgba(255,255,255,0.03) inset, 0 20px 40px -24px rgba(0,0,0,0.65);
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  background:
    radial-gradient(1100px 560px at 12% -8%, rgba(255,138,61,0.07), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(52,224,200,0.06), transparent 55%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 380px);
  min-height: 100vh;
  letter-spacing: 0.1px;
}

.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.01) 0px,
    rgba(255,255,255,0.01) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 999;
  mix-blend-mode: overlay;
}

/* ---------------- Topbar ---------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 18px 28px;
  background: rgba(10,14,19,0.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 14px; }

.brand-mark {
  font-family: var(--font-head);
  font-style: italic;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--bg);
  background: linear-gradient(135deg, var(--amber-soft), var(--amber));
  padding: 5px 12px 7px;
  border-radius: 6px;
  box-shadow: 0 6px 18px -6px rgba(255,138,61,0.55);
}

.brand-text { display: flex; flex-direction: column; line-height: 1.3; }
.brand-name { font-family: var(--font-head); font-size: 16.5px; font-weight: 600; letter-spacing: 0.2px; }
.brand-tag { font-family: var(--font-data); font-size: 10.5px; color: var(--teal); letter-spacing: 0.4px; }

.tabs {
  display: flex;
  gap: 2px;
  flex: 1;
  flex-wrap: wrap;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
}

.tab {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-mid);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 15px;
  cursor: pointer;
  border-radius: 7px;
  transition: color .15s ease, background .2s ease;
}
.tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.tab.active {
  color: #1A0E06;
  background: linear-gradient(135deg, var(--amber-soft), var(--amber));
  font-weight: 600;
  box-shadow: 0 4px 14px -4px rgba(255,138,61,0.5);
}

.clock {
  font-family: var(--font-data);
  color: var(--teal);
  font-size: 15px;
  min-width: 90px;
  text-align: right;
  letter-spacing: 0.5px;
}

/* ---------------- Layout scaffolding ---------------- */

main#app { padding: 22px 24px 60px; max-width: 1500px; margin: 0 auto; }

.view { display: none; animation: fadeIn .25s ease; }
.view.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.grid {
  display: grid;
  gap: 16px;
}
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-span-2 { grid-column: span 2; }

@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-span-2 { grid-column: span 1; }
}
@media (max-width: 640px) {
  .grid-4, .grid-3 { grid-template-columns: 1fr; }
}

/* ---------------- Panel (control-tower module) ---------------- */

.panel {
  position: relative;
  background: linear-gradient(180deg, var(--panel-alt), var(--panel));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 20px 18px;
  box-shadow: var(--shadow-panel);
}

/* Fine top hairline accent — control-tower instrument feel, not a rounded SaaS card */
.panel::before {
  content: "";
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-lt) 20%, var(--border-lt) 80%, transparent);
}

.panel-title {
  font-family: var(--font-data);
  font-size: 11px;
  letter-spacing: 0.6px;
  color: var(--text-dim);
  margin: 0 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.panel-title .badge {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--teal);
  border: 1px solid var(--teal-dim);
  padding: 1px 8px;
  border-radius: 20px;
  background: rgba(52,224,200,0.06);
}

/* ---------------- KPI cards ---------------- */

.kpi {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kpi-label {
  font-family: var(--font-data);
  font-size: 10.5px;
  letter-spacing: 0.5px;
  color: var(--text-dim);
}
.kpi-value {
  font-family: var(--font-head);
  font-size: 34px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.05;
}
.kpi-value.amber { color: var(--amber-soft); }
.kpi-value.teal { color: var(--teal); }
.kpi-value.danger { color: var(--danger); }
.kpi-value.success { color: var(--success); }
.kpi-sub { font-size: 12px; color: var(--text-mid); }

/* ---------------- Bars / simple charts (hand-rolled, no CDN deps) ---------------- */

.barlist { display: flex; flex-direction: column; gap: 10px; }
.barrow { display: grid; grid-template-columns: 140px 1fr 70px; align-items: center; gap: 10px; }
.barrow .label { font-size: 12.5px; color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barrow .track { height: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.barrow .fill { height: 100%; background: linear-gradient(90deg, var(--teal-dim), var(--teal)); }
.barrow .fill.amber { background: linear-gradient(90deg, var(--amber-dim), var(--amber)); }
.barrow .fill.danger { background: linear-gradient(90deg, #7a2126, var(--danger)); }
.barrow .val { font-family: var(--font-data); font-size: 12px; text-align: right; color: var(--text); }

.sparkline-wrap { width: 100%; overflow-x: auto; }

/* ---------------- Tables ---------------- */

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.8px;
}
table.data th {
  text-align: left;
  font-family: var(--font-data);
  font-weight: 600;
  color: var(--text-dim);
  font-size: 10.5px;
  letter-spacing: 0.4px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-lt);
}
table.data td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-mid);
}
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }

.pill {
  display: inline-block;
  font-size: 10.5px;
  font-family: var(--font-data);
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border-lt);
}
.pill.risk-High { color: var(--danger); border-color: #5b2226; }
.pill.risk-Medium { color: var(--warn); border-color: #5b4a1f; }
.pill.risk-Low { color: var(--success); border-color: #205a3d; }
.pill.status-InTransit { color: var(--teal); border-color: var(--teal-dim); }
.pill.status-Delayed { color: var(--danger); border-color: #5b2226; }
.pill.status-Delivered { color: var(--success); border-color: #205a3d; }

/* ---------------- Section header ---------------- */

.view-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 8px;
}
.view-head h1 {
  font-family: var(--font-head);
  font-style: italic;
  font-size: 28px;
  margin: 0;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.2px;
}
.view-head p { margin: 6px 0 0; color: var(--text-dim); font-size: 13.5px; max-width: 62ch; line-height: 1.5; }

/* ---------------- Alert / incident feed ---------------- */

.feed { display: flex; flex-direction: column; gap: 0; }
.feed-item {
  display: grid;
  grid-template-columns: 82px 1fr 90px;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  align-items: center;
}
.feed-item:last-child { border-bottom: none; }
.feed-item .date { font-family: var(--font-data); color: var(--text-dim); font-size: 11px; }
.feed-item .type { color: var(--text); }
.feed-item .type small { color: var(--text-dim); display:block; font-size: 11px; }
.feed-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.feed-dot.open { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.feed-dot.resolved { background: var(--success); }

/* ---------------- Marketplace cards ---------------- */

.mp-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 15px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: border-color .15s ease, background .15s ease;
}
.mp-card:hover { border-color: var(--border-lt); background: rgba(255,255,255,0.035); }
.mp-card .route { font-family: var(--font-data); color: var(--teal); font-size: 12px; letter-spacing: 0.2px; }
.mp-card .cargo { font-size: 14px; color: var(--text); font-family: var(--font-head); }
.mp-card .meta { font-size: 11.5px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }

/* ---------------- Footer ---------------- */

.statusbar {
  position: sticky;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 24px;
  background: #0A0E13;
  border-top: 1px solid var(--border);
  font-family: var(--font-data);
  font-size: 11px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.statusbar code { color: var(--text-mid); }
.offline-pill { color: var(--success); }

/* ---------------- Misc ---------------- */

.muted { color: var(--text-dim); }
.two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

</style>
</head>

<script>
/* ============================================================
   Gedion Freight Intelligence — Dashboard App
   Pure vanilla JS. Reads window.GFI_DATA (from data.js).
   No network calls — works fully offline via file://.
   ============================================================ */

const fmtZAR = (n) => "R " + Number(n || 0).toLocaleString("en-ZA", { maximumFractionDigits: 0 });
const fmtNum = (n) => Number(n || 0).toLocaleString("en-ZA");
const fmtPct = (n) => `${Number(n || 0).toFixed(1)}%`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function barRow(label, value, max, fmt = fmtNum, cls = "") {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return `
    <div class="barrow">
      <div class="label" title="${esc(label)}">${esc(label)}</div>
      <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>
      <div class="val">${fmt(value)}</div>
    </div>`;
}

function panel(title, innerHtml, badge = "") {
  return `
    <div class="panel">
      <div class="panel-title"><span>${esc(title)}</span>${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</div>
      ${innerHtml}
    </div>`;
}

function kpiCard(label, value, sub = "", cls = "") {
  return `
    <div class="panel kpi">
      <div class="kpi-label">${esc(label)}</div>
      <div class="kpi-value ${cls}">${value}</div>
      ${sub ? `<div class="kpi-sub">${sub}</div>` : ""}
    </div>`;
}

/* ---------------- View: Control Tower ---------------- */

function renderTower(d) {
  const k = d.kpis;
  const topCorridors = d.revenue_by_corridor.slice(0, 6);
  const maxRev = Math.max(...topCorridors.map(c => c.revenue), 1);
  const board = d.active_loads_board;

  return `
    <div class="view-head">
      <div>
        <h1>Freight Control Tower</h1>
        <p>Live operations summary across the Gedion network — loads, fleet, revenue, and risk in one view.</p>
      </div>
    </div>

    <div class="grid grid-4" style="margin-bottom:16px;">
      ${kpiCard("Total loads (12 mo)", fmtNum(k.total_loads))}
      ${kpiCard("Revenue in flight", fmtZAR(k.total_revenue_zar), "delivered + in-transit", "amber")}
      ${kpiCard("On-time delivery", fmtPct(k.on_time_pct), "", k.on_time_pct >= 80 ? "success" : "danger")}
      ${kpiCard("Fleet utilisation", fmtPct(k.fleet_utilisation_pct), `${k.active_trucks} / ${k.total_trucks} trucks active`, "teal")}
    </div>

    <div class="two-col" style="margin-bottom:16px;">
      ${panel("Revenue by corridor (top 6)", `<div class="barlist">${
        topCorridors.map(c => barRow(c.corridor, c.revenue, maxRev, fmtZAR, c.risk_rating === "High" ? "amber" : "")).join("")
      }</div>`, "ZAR")}

      ${panel("Network risk", `
        <div class="grid grid-2" style="gap:12px;">
          ${kpiCard("Open security incidents", fmtNum(k.open_incidents), "unresolved right now", k.open_incidents > 0 ? "danger" : "success")}
          ${kpiCard("Empty return rate", fmtPct(k.empty_return_pct), "AI dispatch target < 20%", k.empty_return_pct > 20 ? "danger" : "success")}
        </div>
      `)}
    </div>

    ${panel("In transit / delayed — live board", `
      <table class="data">
        <thead><tr><th>Load</th><th>Corridor</th><th>Cargo</th><th>Transporter</th><th>Truck</th><th>Status</th><th>ETA</th></tr></thead>
        <tbody>
          ${board.map(r => `
            <tr>
              <td>#${r.load_id}</td>
              <td>${esc(r.corridor)}</td>
              <td>${esc(r.cargo)}</td>
              <td>${esc(r.transporter)}</td>
              <td>${esc(r.truck || "—")}</td>
              <td><span class="pill status-${r.status}">${esc(r.status)}</span></td>
              <td>${esc(r.eta)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    `, `${board.length} active`)}
  `;
}

/* ---------------- View: Marketplace ---------------- */

function renderMarketplace(d) {
  const board = d.active_loads_board;
  const subs = d.subscriptions_by_tier;
  const maxSub = Math.max(...subs.map(s => s.mrr), 1);

  return `
    <div class="view-head">
      <div>
        <h1>Freight Marketplace</h1>
        <p>Uber-style load matching — customers post loads, transporters bid and accept.</p>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:16px;">
      ${kpiCard("Active customers", fmtNum(d.kpis.active_customers))}
      ${kpiCard("Monthly recurring revenue", fmtZAR(d.kpis.mrr_zar), "across all plan tiers", "amber")}
      ${kpiCard("Avg load value", fmtZAR(d.kpis.total_revenue_zar / Math.max(d.kpis.total_loads, 1)))}
    </div>

    <div class="two-col">
      ${panel("Open load board (sample)", `
        <div class="grid grid-2" style="gap:10px;">
          ${board.slice(0, 8).map(r => `
            <div class="mp-card">
              <div class="route">${esc(r.corridor)}</div>
              <div class="cargo">${esc(r.cargo)}</div>
              <div class="meta"><span>${esc(r.transporter)}</span><span class="pill status-${r.status}">${esc(r.status)}</span></div>
            </div>`).join("")}
        </div>
      `)}

      ${panel("Subscription plan mix", `<div class="barlist">${
        subs.map(s => barRow(`${s.plan_tier} (${s.subscribers})`, s.mrr, maxSub, fmtZAR, "amber")).join("")
      }</div>`, "MRR")}
    </div>
  `;
}

/* ---------------- View: Fleet & Fuel ---------------- */

function renderFleet(d) {
  const fleets = d.fleet_by_transporter;
  const maxFleet = Math.max(...fleets.map(f => f.fleet_size), 1);
  const empty = d.empty_return_by_transporter;

  return `
    <div class="view-head">
      <div>
        <h1>Real-Time Fleet Tracking</h1>
        <p>Fleet status, utilisation, and AI dispatch efficiency by transporter.</p>
      </div>
    </div>

    <div class="grid grid-4" style="margin-bottom:16px;">
      ${kpiCard("Active trucks", fmtNum(d.kpis.active_trucks), "", "teal")}
      ${kpiCard("Total fleet size", fmtNum(d.kpis.total_trucks))}
      ${kpiCard("Fleet utilisation", fmtPct(d.kpis.fleet_utilisation_pct), "", "success")}
      ${kpiCard("Empty return rate", fmtPct(d.kpis.empty_return_pct), "AI dispatch KPI", d.kpis.empty_return_pct > 20 ? "danger" : "success")}
    </div>

    <div class="two-col">
      ${panel("Fleet size by transporter", `<div class="barlist">${
        fleets.map(f => barRow(f.transporter, f.fleet_size, maxFleet, fmtNum)).join("")
      }</div>`)}

      ${panel("Fleet status breakdown", `
        <table class="data">
          <thead><tr><th>Transporter</th><th>Active</th><th>Idle</th><th>Maint.</th><th>Rating</th></tr></thead>
          <tbody>
            ${fleets.map(f => `
              <tr>
                <td>${esc(f.transporter)}</td>
                <td>${f.active}</td>
                <td>${f.idle}</td>
                <td>${f.maintenance}</td>
                <td>★ ${f.rating}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      `)}
    </div>

    <div style="height:16px"></div>
    ${panel("Empty return % by transporter (lower is better)", `<div class="barlist">${
      empty.map(e => barRow(e.transporter, e.empty_return_pct, 100, fmtPct, e.empty_return_pct > 25 ? "danger" : "")).join("")
    }</div>`)}
  `;
}

/* ---------------- View: Corridors ---------------- */

function renderCorridors(d) {
  const onTime = d.on_time_by_corridor;

  return `
    <div class="view-head">
      <div>
        <h1>South African Freight Corridors</h1>
        <p>Durban–Johannesburg, Cape Town–Johannesburg, N3/N4 corridors, and SADC cross-border routes.</p>
      </div>
    </div>

    ${panel("On-time delivery % by corridor", `
      <table class="data">
        <thead><tr><th>Corridor</th><th>Deliveries</th><th>On-time %</th></tr></thead>
        <tbody>
          ${onTime.map(c => `
            <tr>
              <td>${esc(c.corridor)}</td>
              <td>${c.deliveries}</td>
              <td>
                <div class="barrow" style="grid-template-columns: 1fr 60px;">
                  <div class="track"><div class="fill ${c.on_time_pct < 75 ? "danger" : ""}" style="width:${c.on_time_pct}%"></div></div>
                  <div class="val">${fmtPct(c.on_time_pct)}</div>
                </div>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    `)}
  `;
}

/* ---------------- View: Cross-Border ---------------- */

function renderBorder(d) {
  const borders = d.border_performance;
  const maxWait = Math.max(...borders.map(b => b.avg_wait_hours), 1);

  return `
    <div class="view-head">
      <div>
        <h1>Cross-Border Module</h1>
        <p>Botswana · Namibia · Zimbabwe · Mozambique · Zambia · Lesotho · Eswatini — customs, permits, and border wait intelligence.</p>
      </div>
    </div>

    <div class="two-col">
      ${panel("Average wait time by border post", `<div class="barlist">${
        borders.map(b => barRow(`${b.border} (${b.country})`, b.avg_wait_hours, maxWait, (v) => v.toFixed(1) + "h", b.avg_wait_hours > 5 ? "danger" : "")).join("")
      }</div>`)}

      ${panel("Customs clearance performance", `
        <table class="data">
          <thead><tr><th>Border post</th><th>Crossings</th><th>Cleared %</th></tr></thead>
          <tbody>
            ${borders.map(b => `
              <tr><td>${esc(b.border)}</td><td>${b.crossings}</td><td>${fmtPct(b.customs_cleared_pct)}</td></tr>`).join("")}

        </table>

/* ---------------- View: Security ---------------- */

function renderSecurity(d) {
  const inc = d.incidents_by_corridor;
  const maxInc = Math.max(...inc.map(i => i.incidents), 1);
  const feed = d.recent_incidents;

  return `
    <div class="view-head">
      <div>
        <h1>Security Intelligence Layer</h1>
        <p>Route risk scoring, theft hotspots, and driver verification across the network.</p>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:16px;">
      ${kpiCard("Open incidents", fmtNum(d.kpis.open_incidents), "", d.kpis.open_incidents > 0 ? "danger" : "success")}
      ${kpiCard("Corridors flagged high-risk", fmtNum(inc.filter(i => i.risk_rating === "High").length))}
      ${kpiCard("Total incidents logged", fmtNum(inc.reduce((a, i) => a + i.incidents, 0)))}
    </div>

    <div class="two-col">
      ${panel("Theft & incident hotspots", `<div class="barlist">${
        inc.map(i => barRow(`${i.corridor}`, i.incidents, maxInc, fmtNum, i.risk_rating === "High" ? "danger" : "amber")).join("")
      }</div>`, "incidents")}

      ${panel("Recent incident feed", `
        <div class="feed">
          ${feed.map(f => `
            <div class="feed-item">
              <div class="date">${esc(f.date)}</div>
              <div class="type">
                <span class="feed-dot ${f.resolved ? "resolved" : "open"}"></span>${esc(f.type)}
                <small>${esc(f.corridor)} · ${esc(f.truck || "—")}</small>
              </div>
              <div>${f.resolved ? '<span class="pill status-Delivered">Resolved</span>' : '<span class="pill status-Delayed">Open</span>'}</div>
            </div>`).join("")}
        </div>
      `)}
    </div>
  `;
}

/* ---------------- View: Revenue ---------------- */

function renderRevenue(d) {
  const monthly = d.monthly_revenue;
  const maxMonth = Math.max(...monthly.map(m => m.invoiced), 1);
  const byIndustry = d.revenue_by_industry;
  const maxInd = Math.max(...byIndustry.map(i => i.revenue), 1);

  return `
    <div class="view-head">
      <div>
        <h1>Revenue &amp; Industry Mix</h1>
        <p>Invoicing, collections, and revenue concentration across mining, agriculture, retail, and manufacturing.</p>
      </div>
    </div>

    ${panel("Monthly invoiced vs collected (ZAR)", `<div class="barlist">${
      monthly.map(m => barRow(m.month, m.invoiced, maxMonth, fmtZAR)).join("")
    }</div>`)}

    <div style="height:16px"></div>

    ${panel("Revenue by industry", `<div class="barlist">${
      byIndustry.map(i => barRow(`${i.industry} (${i.customers} cust.)`, i.revenue, maxInd, fmtZAR, "amber")).join("")
    }</div>`)}
  `;
}

/* ---------------- Router / boot ---------------- */

const VIEWS = {
  tower: renderTower,
  marketplace: renderMarketplace,
  fleet: renderFleet,
  corridors: renderCorridors,
  border: renderBorder,
  security: renderSecurity,
  revenue: renderRevenue,
};

function showView(name) {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="view active">${VIEWS[name](window.GFI_DATA)}</div>`;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === name));
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  showView(btn.dataset.view);
});

function tickClock() {
  const el = document.getElementById("clock");
  const now = new Date();
  el.textContent = now.toLocaleTimeString("en-ZA", { hour12: false });
}
setInterval(tickClock, 1000);
tickClock();

document.getElementById("last-refresh").textContent =
  "Snapshot generated by analysis.py";

if (!window.GFI_DATA) {
  document.getElementById("app").innerHTML = `
    <div class="panel">
      <div class="panel-title">Data not found</div>
      <p class="muted">Run <code>python generate_data.py</code> then <code>python analysis.py</code> in the /python folder,
      then reopen index.html. This regenerates web/data.js.</p>
    </div>`;
} else {
  showView("tower");
}

</script>
</body>
</html>
